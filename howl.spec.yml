name: "Howl 1.1.0 release readiness"
goal: "Qualify Howl 1.1.0 as a deterministic showcase artifact renderer against real downstream sites and pathological manifests."
version: "1.1.0"
background: "Howl 1.1.0 adds social-card rendering, optional transparent and accessible overlays, cache-friendly no-op rebuilds, and release regression coverage."
scope: "Repository-local CLI behavior, manifest validation and fuzzing, deterministic Markdown/HTML/SVG/gallery rendering, downstream raster reproducibility, output escaping, accessibility metadata, snapshots, and performance evidence."
non_goals:
  - "Posting to social media or scheduling content"
  - "Semantic Kujo verification or invented marketing claims"
relevant_systems:
  - "Kujo runtime"
  - "Howl wrapper"
  - "howl.json"
  - "examples/*.kujo"
  - "dist/howl generated artifacts"
  - "tests/release_regression.py and tests/golden/"
likely_files:
  - "README.md"
  - "howl.kujo"
  - "bin/howl"
  - "src/cli.kujo"
  - "src/manifest.kujo"
  - "src/render_svg.kujo"
  - "tests/run.sh"
  - "tests/howl_eval.json"
acceptance_criteria:
  - "`kujo check` passes for Howl source and tests."
  - "`./tests/run.sh` passes the full 102-assertion suite."
  - "`tests/release_regression.py` passes snapshots, fuzzing, no-op, layout, escaping, contrast, corpus, benchmark, and JPEG checks."
  - "`howl help`, `howl version`, `howl validate`, `howl list`, and `howl render` work locally."
  - "Eval suite proves help/version/validate/render and test harness behavior."
  - "robertdevore.com, python.robertdevore.com, kujolang.ai, and agents.kujolang.ai reproduce committed Howl artifacts without unreviewed diffs."
  - "Docs keep offline deterministic rendering scope clear and avoid enterprise/platform/posting claims."
eval_requirements:
  - description: "Howl help succeeds."
    check_type: "command_succeeds"
    params:
      command: "howl help"
  - description: "Howl test suite succeeds."
    check_type: "command_succeeds"
    params:
      command: "./tests/run.sh"
  - description: "Howl validate succeeds."
    check_type: "command_succeeds"
    params:
      command: "howl validate"
  - description: "Howl release regression succeeds."
    check_type: "command_succeeds"
    params:
      command: "python3 tests/release_regression.py"
risks:
  - risk: "Howl renders claims supplied in manifests and examples."
    mitigation: "Keep docs clear that Howl does not invent or verify claims; review manifests before launch use."
    severity: "medium"
  - risk: "Rendered artifacts can drift if generated outputs are committed without regeneration."
    mitigation: "Run the golden/corpus regression gate and inspect snapshot diffs before accepting an intentional rendering change."
    severity: "medium"
dependencies:
  - "kujo on PATH or KUJO set"
  - "Bash 3.2+"
review_expectations:
  - "Review manifest text and rendered HTML/SVG/Markdown before publishing showcase material."
  - "Review generated artifacts for escaping-sensitive content after renderer changes."
human_approval_points:
  - "Before accepting intentional golden or downstream rendering diffs"
  - "Before publishing or tagging when any downstream validator is failing"
  - "Before posting or scheduling rendered marketing content"
priority: "high"
tags:
  - "kujo"
  - "howl"
  - "launch-readiness"
