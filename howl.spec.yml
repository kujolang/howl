name: "Howl launch readiness review"
goal: "Keep Howl locally release-ready as a Kujo-native deterministic showcase artifact renderer for trusted example manifests."
version: "1.1.0"
background: "Howl is part of the Kujo prelaunch supporting-tooling matrix. The verified scope is offline manifest validation and deterministic Markdown/HTML/SVG/gallery rendering from trusted examples."
scope: "Repository-local CLI behavior, launcher compatibility, manifest validation, deterministic rendering, output escaping, docs/readiness wording, and launch evidence capture."
non_goals:
  - "Publishing packages or public releases"
  - "Pushing final release tags"
  - "Posting to social media or scheduling content"
  - "Semantic Kujo verification or invented marketing claims"
relevant_systems:
  - "Kujo runtime"
  - "Howl wrapper"
  - "howl.json"
  - "examples/*.kujo"
  - "dist/howl generated artifacts"
  - "prelaunch launch evidence packet"
likely_files:
  - "README.md"
  - "howl.kujo"
  - "bin/howl"
  - "src/cli.kujo"
  - "src/manifest.kujo"
  - "src/render_svg.kujo"
  - "tests/run.sh"
  - "tests/howl_eval.json"
acceptance_criteria:
  - "`kujo check` passes for Howl source and tests."
  - "`./tests/run.sh` passes the full 70-assertion suite."
  - "`howl help`, `howl version`, `howl validate`, `howl list`, and `howl render` work locally."
  - "Eval suite proves help/version/validate/render and test harness behavior."
  - "Docs keep offline deterministic rendering scope clear and avoid enterprise/platform/posting claims."
eval_requirements:
  - description: "Howl help succeeds."
    check_type: "command_succeeds"
    params:
      command: "howl help"
  - description: "Howl test suite succeeds."
    check_type: "command_succeeds"
    params:
      command: "./tests/run.sh"
  - description: "Howl validate succeeds."
    check_type: "command_succeeds"
    params:
      command: "howl validate"
risks:
  - risk: "Howl renders claims supplied in manifests and examples."
    mitigation: "Keep docs clear that Howl does not invent or verify claims; review manifests before launch use."
    severity: "medium"
  - risk: "Rendered artifacts can drift if generated outputs are committed without regeneration."
    mitigation: "Run `howl render` and inspect diffs before committing generated artifacts."
    severity: "medium"
dependencies:
  - "kujo on PATH or KUJO set"
  - "Bash 3.2+"
review_expectations:
  - "Review manifest text and rendered HTML/SVG/Markdown before publishing showcase material."
  - "Review generated artifacts for escaping-sensitive content after renderer changes."
human_approval_points:
  - "Before publishing packages or public releases"
  - "Before pushing final release tags"
  - "Before posting or scheduling rendered marketing content"
priority: "high"
tags:
  - "kujo"
  - "howl"
  - "launch-readiness"
